name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install FFmpeg\n        run: sudo apt-get update && sudo apt-get install -y ffmpeg\n\n      - name: Check FFmpeg dependencies\n        run: npm run check:ffmpeg\n\n      - name: TypeScript check
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Verify build output
        run: test -f dist/index.html
